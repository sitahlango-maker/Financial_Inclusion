name: WIF test
on: workflow_dispatch

permissions:
  id-token: write   # lets GitHub issue its ID token (the "school ID")
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/794553979370/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@my-project-ylta-511117.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth list
      - run: gcloud run services list --project=my-project-ylta-511117 --region=us-central1
